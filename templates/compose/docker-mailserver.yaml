# documentation: https://docker-mailserver.github.io/docker-mailserver/latest/
# slogan: "Docker Mailserver is a production-ready fullstack but simple mail server (SMTP, IMAP, LDAP, Antispam, Antivirus, etc.)."
# category: email
# tags: mail,email,smtp,imap,postfix,dovecot,self-hosted
# logo: svgs/docker-mailserver.svg
# port: 25

services:
  docker-mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    hostname: ${OVERRIDE_HOSTNAME:-mail.example.com}
    environment:
      - OVERRIDE_HOSTNAME=${OVERRIDE_HOSTNAME:-mail.example.com}
      - POSTMASTER_ADDRESS=${POSTMASTER_ADDRESS:-postmaster@example.com}
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PERMIT_DOCKER=${PERMIT_DOCKER:-connected-networks}
      - TLS_LEVEL=${TLS_LEVEL:-modern}
      - ENABLE_POP3=${ENABLE_POP3:-0}
      - ENABLE_CLAMAV=${ENABLE_CLAMAV:-0}
      - ENABLE_FAIL2BAN=${ENABLE_FAIL2BAN:-0}
      - ENABLE_RSPAMD=${ENABLE_RSPAMD:-0}
      - ENABLE_AMAVIS=${ENABLE_AMAVIS:-1}
      - ENABLE_DNSBL=${ENABLE_DNSBL:-0}
      - ENABLE_UPDATE_CHECK=${ENABLE_UPDATE_CHECK:-0}
      - SPOOF_PROTECTION=${SPOOF_PROTECTION:-1}
    ports:
      - "25:25"
      - "143:143"
      - "465:465"
      - "587:587"
      - "993:993"
    volumes:
      - docker-mailserver-data:/var/mail
      - docker-mailserver-state:/var/mail-state
      - docker-mailserver-logs:/var/log/mail
      - docker-mailserver-config:/tmp/docker-mailserver
    restart: unless-stopped
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "ss --listening --tcp | grep -q ':smtp' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
